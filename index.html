<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B KWIK</title>
<meta name="theme-color" content="#0b1b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B KWIK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* palette: navy + gold, the owner's theme */
  --navy:#0f2342; --navy-2:#1c3763; --gold:#c9a24a; --gold-soft:#f5ecd3; --gold-ink:#7c5e17;
  --paper:#f3f5f9; --card:#ffffff; --ink:#15213a; --muted:#5b687e; --line:#dfe3ec;
  --good:#1d7349; --good-bg:#e2f2e9; --warn:#8f5a00; --warn-bg:#fcefd2; --bad:#b0271f; --bad-bg:#fbe3e1;
  --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
  /* layout: laptop = navy sidebar of sections + two company tabs on top; phone = company tabs on top + bottom section bar */
}
/* company themes, three colours each + light tinted page:
   B IN DALBY = Teal (deep slate, teal, aqua) · KWIK TRIP = Sapphire (midnight, sapphire, periwinkle) */
body{
  --navy:#1b2e38; --navy-2:#2a4552; --gold:#5fa0b0; --gold-soft:#dff0f3; --gold-ink:#2c6977;
  --third:#8ecfdc; --third-soft:#e4f4f7; --paper:#d3e7ec; --line:#c4dae0; --cardtint:#f5fafb;
  --muted:#526a72; --ink:#15262d; --notice-line:#b9dde5; --gold-hover:#74b2c1;
}
body[data-co="kwik"]{
  --navy:#151f38; --navy-2:#243257; --gold:#6a8fd4; --gold-soft:#e2e9f8; --gold-ink:#34539a;
  --third:#9fb9e8; --third-soft:#e8eefa; --paper:#d6e0f3; --line:#c9d4ea; --cardtint:#f6f8fd;
  --muted:#56627c; --ink:#141d33; --notice-line:#c3d2ef; --gold-hover:#7d9edc;
}
.ctab[data-co="dalby"]{--tab:#1b2e38;--tabacc:#5fa0b0}
.ctab[data-co="kwik"]{--tab:#151f38;--tabacc:#6a8fd4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:400 30px/1.15 var(--display);color:var(--navy)}
h2{font:600 15px/1.3 var(--body);color:var(--navy)}
h3{font:600 14px/1.3 var(--body)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:#e9edf5;padding:24px 14px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.mark{width:38px;height:38px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:400 17px var(--display);flex:none}
.brand b{display:block;font-size:14px;color:#fff;letter-spacing:.4px}
.brand small{color:#9fb0cc;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:#c9d3e6;padding:10px 12px;border-radius:8px;text-align:left;font-weight:500}
.nav button:hover{background:var(--navy-2);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg,.bnav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.status{margin-top:auto;font-size:12px;color:#9fb0cc;padding:0 8px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#9fb0cc;flex:none}
.dot.ok{background:#5bc48c}.dot.busy{background:var(--gold)}.dot.off{background:#e98a82}

main{padding:0 32px 56px;min-width:0}
.mtop{display:none}
.ctabs{position:sticky;top:0;z-index:5;background:var(--paper);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 0 14px;max-width:1180px}
.ctab{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;justify-content:center;text-align:left;display:flex;flex-direction:column;min-width:0}
.ctab b{font-weight:700;font-size:15px;letter-spacing:1.2px}
.ctab small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctab{border-left:5px solid var(--tabacc)}
.ctab b{color:var(--tab)}
.ctab[aria-selected="true"]{background:var(--tab);border-color:var(--tab);border-left-color:var(--tabacc);color:#fff;box-shadow:inset 0 -3px 0 var(--tabacc)}
.ctab[aria-selected="true"] b{color:#fff}
.ctab[aria-selected="true"] small{color:#c4cfe3}

.view{max-width:1180px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;border-top:4px solid var(--gold)}
.hero > div{min-width:0}
.eyebrow{margin:0 0 4px;color:var(--gold-ink);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.addr{margin:6px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:#eef1f6;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.navy{background:var(--navy);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font:500 22px/1.2 var(--mono);color:var(--navy);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:#e8ebf1;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#bfc7d6}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold:hover{background:var(--gold-hover)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#efc3bf;background:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.link{background:none;border:0;color:var(--navy-2);font-weight:600;font-size:13px;padding:4px;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:4px}
.pagehead p{margin-top:4px;max-width:64ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #eef0f5;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7f8fb}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:14px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px}
dl.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

.shares{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.share{display:flex;flex-direction:column;gap:8px}
.share h3{display:flex;justify-content:space-between;align-items:baseline}
.share h3 span{font:500 13px var(--mono);color:var(--gold-ink)}
.member{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#f6f7fa;border:1px solid transparent;border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.member:hover{border-color:var(--line)}
.member b{display:block;font-weight:600;font-size:14px}
.member small{color:var(--muted);font-size:12px}
.member .pct{font:500 13px var(--mono);color:var(--navy)}

.sbars{display:flex;flex-direction:column;gap:12px}
.sbar{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.sbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.track{position:relative;height:10px;background:#eceff4;border-radius:5px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:5px}
.track u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--gold);border-radius:2px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--navy)}
.legend i.g{width:3px;height:12px;background:var(--gold)}

.uprow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f5}
.uprow:last-child{border-bottom:0}
.datebox{width:48px;flex:none;text-align:center;border-radius:8px;background:var(--gold-soft);color:var(--gold-ink);padding:5px 0;line-height:1.1}
.datebox b{display:block;font:500 18px var(--mono);color:var(--navy)}
.datebox small{font-size:11px;text-transform:uppercase;font-weight:700}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:600}

.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stage{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fbfbfd;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.stage:hover{border-color:#bfc7d6}
.stage .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}

.rem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 0;border-bottom:1px solid #eef0f5;align-items:center}
.rem:last-child{border-bottom:0}
.rem .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rem.paused{opacity:.6}
.notice{background:var(--gold-soft);border:1px solid var(--notice-line);color:var(--gold-ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.info{background:#e9eef7;border-color:#cdd8ea;color:#203658}

svg.chart{width:100%;height:auto;display:block}
.axis{font:11px var(--body);fill:var(--muted)}
.axis.v{font-family:var(--mono)}

#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,20,40,.45)}
.sheet{position:relative;background:var(--card);width:min(580px,calc(100% - 32px));max-height:calc(100% - 48px);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(10,20,40,.3)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet h2{font:400 22px var(--display)}
.fbody{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.fbody > *{grid-column:1/-1}
.fbody > .field.half{grid-column:auto}
.field{display:flex;flex-direction:column;gap:4px;border:0;padding:0;margin:0;min-width:0}
.field label,.field legend{font-size:13px;font-weight:600;padding:0}
input,select,textarea{font:inherit;font-size:16px;padding:9px 11px;border:1px solid #cbd2de;border-radius:9px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical}
.hint{color:var(--muted);font-size:12px}
.checks{display:flex;gap:16px;flex-wrap:wrap;padding-top:4px}
.check{display:flex;gap:6px;align-items:center;font-size:14px}
.check input{width:18px;height:18px}
.ferr{color:var(--bad);font-size:13px}
.ferr:empty{display:none}
.preview{background:#f6f7fa;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap}
.sheet footer{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.sp{flex:1}
.icon-btn{background:none;border:0;font-size:26px;line-height:1;padding:2px 8px;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:10px}
.ritem{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ritem p{white-space:pre-wrap;font-size:13px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(10,20,40,.3);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.bnav{display:none}
.loading{padding:40px 0;color:var(--muted)}


/* three-colour accents */
body{transition:background-color .25s}
.kpis .kpi{border-top:4px solid var(--navy)}
.kpis .kpi:nth-child(3n+2){border-top-color:var(--gold)}
.kpis .kpi:nth-child(3n+3){border-top-color:var(--third)}
.ch h2{display:flex;align-items:center;gap:8px}
.ch h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--third);flex:none}
.hero{background:linear-gradient(120deg,var(--card) 55%,var(--third-soft))}
th{background:var(--third-soft)}
th:first-child{border-radius:8px 0 0 8px} th:last-child{border-radius:0 8px 8px 0}
.chip{background:var(--third-soft);color:var(--ink)}
.member{background:var(--cardtint);border-color:var(--line)}
.share{border-top:4px solid var(--third)}
.stage{background:var(--cardtint)}
.track{background:var(--third-soft)}
.bar{background:var(--third-soft)}
.empty{background:var(--cardtint)}
.side .mark,.mtop .mark{box-shadow:0 0 0 3px var(--third)}
.nav button[aria-current="page"] svg{color:var(--third)}
@media (max-width:600px){th{background:none}}

/* glass look: soft colour glow behind see-through panels */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40rem 30rem at 8% 0%, color-mix(in srgb,var(--third) 70%,transparent), transparent 70%),
    radial-gradient(36rem 28rem at 100% 15%, color-mix(in srgb,var(--gold) 55%,transparent), transparent 70%),
    radial-gradient(44rem 34rem at 60% 100%, color-mix(in srgb,var(--navy-2) 35%,transparent), transparent 70%),
    var(--paper)}
body{background:var(--paper)}
.card,.kpi,.ctab,.notice,.stage,.member,.empty{
  background:color-mix(in srgb,var(--glass) 52%,transparent)!important;
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border-color:color-mix(in srgb,var(--glass) 70%,transparent)!important;
  box-shadow:0 6px 24px color-mix(in srgb,var(--navy) 10%,transparent), inset 0 1px 0 color-mix(in srgb,var(--glass) 80%,transparent)}
.hero{background:linear-gradient(120deg,color-mix(in srgb,var(--glass) 60%,transparent) 50%,color-mix(in srgb,var(--third) 30%,transparent))!important}
.kpis .kpi{border-top-width:4px;border-top-style:solid}
.kpis .kpi{border-top-color:var(--navy)!important}
.kpis .kpi:nth-child(3n+2){border-top-color:var(--gold)!important}
.kpis .kpi:nth-child(3n+3){border-top-color:var(--third)!important}
.share{border-top:4px solid var(--third)!important}
.hero{border-top:4px solid var(--gold)!important}
.side,.bnav{background:color-mix(in srgb,var(--navy) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.ctabs{background:transparent}
th{background:color-mix(in srgb,var(--third) 22%,transparent)}
.sheet{background:color-mix(in srgb,var(--glass) 85%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.scrim{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
/* centred company tabs + press-in effect */
.ctab{align-items:center;text-align:center;border-left-width:1px!important;border-bottom:4px solid var(--tabacc)!important}
.ctab[aria-selected="true"]{background:color-mix(in srgb,var(--tab) 88%,transparent)!important;border-color:var(--tab)!important;border-bottom-color:var(--tabacc)!important;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.35), inset 0 -2px 0 var(--tabacc)!important;transform:translateY(2px)}
button,.member,.stage,tr.click{transition:transform .08s ease, box-shadow .12s ease, filter .12s}
button:active,.member:active,.stage:active{transform:translateY(2px) scale(.98);filter:brightness(.96);box-shadow:inset 0 3px 8px rgba(0,0,0,.18)!important}
.ctab:active{transform:translateY(3px) scale(.98)}
.btn{box-shadow:0 2px 0 color-mix(in srgb,var(--navy) 18%,transparent)}
.btn:active{box-shadow:inset 0 2px 6px rgba(0,0,0,.22)}
.bnav button:active,.nav button:active{transform:scale(.94)}

/* clearer, more see-through tinted glass */
body::before{background:
    radial-gradient(38rem 30rem at 5% 0%, color-mix(in srgb,var(--third) 95%,transparent), transparent 70%),
    radial-gradient(34rem 28rem at 100% 10%, color-mix(in srgb,var(--gold) 80%,transparent), transparent 70%),
    radial-gradient(40rem 32rem at 30% 70%, color-mix(in srgb,var(--third) 55%,transparent), transparent 70%),
    radial-gradient(44rem 34rem at 85% 100%, color-mix(in srgb,var(--navy-2) 55%,transparent), transparent 70%),
    var(--paper)!important}
.card,.kpi,.ctab,.notice,.stage,.member,.empty{
  background:linear-gradient(135deg,color-mix(in srgb,var(--glass) 38%,transparent),color-mix(in srgb,var(--third) 14%,transparent))!important;
  -webkit-backdrop-filter:blur(7px) saturate(170%);backdrop-filter:blur(7px) saturate(170%);
  border-color:color-mix(in srgb,var(--glass) 65%,transparent)!important;
  box-shadow:0 8px 28px color-mix(in srgb,var(--navy) 14%,transparent), inset 0 1px 0 color-mix(in srgb,var(--glass) 90%,transparent), inset 0 -1px 0 color-mix(in srgb,var(--third) 30%,transparent)!important}
.member,.stage,.empty{background:color-mix(in srgb,var(--glass) 28%,transparent)!important}
.hero{background:linear-gradient(120deg,color-mix(in srgb,var(--glass) 42%,transparent) 45%,color-mix(in srgb,var(--third) 28%,transparent))!important}
.ctab[aria-selected="true"]{background:color-mix(in srgb,var(--tab) 72%,transparent)!important}
.side,.bnav{background:color-mix(in srgb,var(--navy) 70%,transparent)!important;-webkit-backdrop-filter:blur(10px) saturate(170%);backdrop-filter:blur(10px) saturate(170%)}
.side{border-right:1px solid color-mix(in srgb,var(--glass) 25%,transparent)}
th{background:color-mix(in srgb,var(--third) 18%,transparent)}
.chip{background:color-mix(in srgb,var(--third) 25%,transparent)}
.track,.bar{background:color-mix(in srgb,var(--glass) 45%,transparent)}
.sheet{background:color-mix(in srgb,var(--glass) 72%,transparent)!important;-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
input,select,textarea{background:color-mix(in srgb,var(--glass) 75%,transparent)}
@media (max-width:1150px){.shares{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){

/* ===== design pack ===== */
/* status edges */

.kpi{position:relative}

/* page transitions */
.view.enter > *{animation:vIn .38s cubic-bezier(.2,.8,.2,1) both}
.view.enter > *:nth-child(2){animation-delay:.04s}.view.enter > *:nth-child(3){animation-delay:.08s}.view.enter > *:nth-child(4){animation-delay:.12s}

  o.auto=Object.assign({statementDay:0,statementWho:'plan',overdueDays:0,receipts:false,loanAlertDays:0,billAlertDays:0,backup:''},o.auto&&typeof o.auto==='object'?o.auto:{});

/* ---------- calculations ---------- */
function pctOf(c,p){const n=c.shareholders.filter(x=>x.share===p.share).length||1;return 25/n}

function rateAt(c,date){const r=[...c.loan.rates].sort(byDate);let v=r.length?num(r[0].rate):0;for(const x of r){if(x.date<=date)v=num(x.rate)}return v}
function currentRate(c){const r=[...c.loan.rates].sort(byDate);return r.length?num(r[r.length-1].rate):0}
function amort(P,ratePct,years){const r=ratePct/100/12,n=years*12;if(!P||!n)return 0;if(!r)return P/n;return P*r/(1-Math.pow(1+r,-n))}
function loanState(c){
  let bal=num(c.loan.principal),ip=0,pp=0,fees=0;const rows=[];
  const od=c.loan.existing==='existing'&&c.loan.openingDate&&c.loan.openingBalance!==''?c.loan.openingDate:null;let opened=!od;
  for(const p of [...c.payments].sort(byDate)){
    if(!opened&&p.date>od){bal=num(c.loan.openingBalance);opened=true}
    const t=p.type||'regular',r=rateAt(c,p.date),amt=num(p.amount);let i=0,pr=0,f=0;
    if(t==='fee')f=amt;
    else if(t==='interest')i=amt;
    else if(t==='extra')pr=Math.min(bal,amt);
    else{const man=p.interestManual!==''&&p.interestManual!=null;i=man?num(p.interestManual):bal*r/100/12;pr=Math.max(0,Math.min(bal,amt-i))}
    bal=Math.max(0,bal-pr);ip+=i;pp+=pr;fees+=f;rows.push({...p,type:t,rate:r,interest:i,principal:pr,fee:f,balance:bal});
  }
  if(!opened)bal=num(c.loan.openingBalance);
  const rate=currentRate(c),R=num(c.loan.repayment),mi=rate/100/12;
  let months=null;const proj=[{m:0,b:bal}];
  if(bal>0&&R>bal*mi){let b=bal,m=0;while(b>0.01&&m<600){b=b*(1+mi)-R;m++;if(m%12===0||b<=0.01)proj.push({m,b:Math.max(0,b)})}months=m}
  return {bal,ip,pp,fees,rows:rows.reverse(),rate,R,months,proj,monthInterest:bal*mi,paidTotal:sum(c.payments,x=>x.amount)};
}
function dueInfo(c){
  const dd=Math.min(28,Math.max(1,num(c.loan.dueDay)||1)),t=today();

  let d=new Date(t.getFullYear(),t.getMonth(),dd);
  const start=pd(c.loan.startDate);
  if(paidIn(d)||(start&&d<start))d=addMonths(d,1,dd);
  if(start&&d<start)d=addMonths(start,1,dd);
  return {date:d,days:dayDiff(t,d)};
}

}

function spark(vals){vals=(vals||[]).map(Number).filter(v=>isFinite(v));if(vals.length<2)return '';
  const W=120,H=30,mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;

function monthStrip(c,L,due){
  const t=today(),y=t.getFullYear(),m=t.getMonth(),ms=iso(new Date(y,m,1)),me=iso(new Date(y,m+1,0)),inM=d=>d>=ms&&d<=me;
  const items=[];
  if(num(c.loan.principal)){const dd=Math.min(28,Math.max(1,num(c.loan.dueDay)||1)),dDate=iso(new Date(y,m,dd));
    const paid=c.payments.some(p=>(p.type||'regular')==='regular'&&inM(p.date||''));items.push({t:'Loan repayment',a:num(c.loan.repayment),d:dDate,paid})}
  c.reminders.filter(r=>r.active!==false&&r.type!=='Loan repayment'&&r.nextDate&&inM(r.nextDate)).forEach(r=>items.push({t:r.title,a:num(r.amount),d:r.nextDate,paid:false}));
  const paidM=sum(c.payments.filter(p=>inM(p.date||'')),p=>p.amount)+sum(c.expenses.filter(e=>inM(e.date||'')),e=>e.amount);
  const left=items.filter(i=>!i.paid),leftAmt=sum(left,i=>i.a),overdue=left.some(i=>i.d<iso(t));
  const mName=t.toLocaleDateString('en-AU',{month:'long'});
  return `<div class="mstrip">
    <div class="ms-i">${icon('cal')}<span><small>Due in ${mName}</small><b>${m0(sum(items,i=>i.a))}</b><em>${items.length} item${items.length===1?'':'s'}</em></span></div>
    <div class="ms-i good">${icon('coins')}<span><small>Paid in ${mName}</small><b>${m0(paidM)}</b><em>mortgage + outgoings</em></span></div>
    <div class="ms-i ${left.length?(overdue?'bad':'warn'):'good'}">${icon(left.length?'receipt':'repeat')}<span><small>Still to pay</small><b>${m0(leftAmt)}</b><em>${left.length?left.map(i=>esc(i.t)).slice(0,2).join(', '):'All done'}</em></span></div>
  </div>`;
}
let calMonth=null;
function calEvents(c,L,y,m){
  const ms=iso(new Date(y,m,1)),me=iso(new Date(y,m+1,0)),ev=[],inM=d=>d&&d>=ms&&d<=me;
  if(num(c.loan.principal)){const dd=Math.min(28,Math.max(1,num(c.loan.dueDay)||1)),d=iso(new Date(y,m,dd));const st=c.loan.startDate||'';
    if(!st||d>st){const paid=c.payments.some(p=>(p.type||'regular')==='regular'&&inM(p.date));ev.push({d,t:'Loan repayment',a:num(c.loan.repayment),k:paid?'paid':'due',ic:'repeat'})}}
  c.reminders.filter(r=>r.active!==false&&r.nextDate&&r.type!=='Loan repayment').forEach(r=>{let d=r.nextDate,n=0;while(d&&d<=me&&n<60){if(d>=ms)ev.push({d,t:r.title,a:num(r.amount),k:'due',ic:'cal'});if(r.frequency==='once')break;d=addFreq(d,r.frequency);n++}});
  c.payments.filter(p=>inM(p.date)).forEach(p=>ev.push({d:p.date,t:'Mortgage · '+payTypeLabel(p.type),a:num(p.amount),k:'paid',ic:PAY_IC[p.type||'regular']}));
  c.expenses.filter(e=>inM(e.date)).forEach(e=>ev.push({d:e.date,t:e.kind==='utility'?(e.utility||e.category):(e.description||'Project cost'),a:num(e.amount),k:'paid',ic:e.kind==='utility'?(UTIL_IC[e.utility]||'doc'):'hammer'}));
  c.contributions.filter(x=>inM(x.date)).forEach(x=>ev.push({d:x.date,t:'Share '+shareOf(c,x)+' paid in',a:num(x.amount),k:'in',ic:'people'}));
  return ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
function vCalendar(c,L){

let rOpt={co:'current',period:'all',from:'',to:'',share:'all',secs:['summary','land','loan','byshare','expenses','construction','chart','upcoming']};
const fyOf=d=>{const x=pd(d);return x?(x.getMonth()>=6?x.getFullYear()+1:x.getFullYear()):null};
const cyOf=d=>{const x=pd(d);return x?x.getFullYear():null};
const fyLabel=y=>`FY ${y-1}-${String(y).slice(2)}`;
function curFY(){return fyOf(iso(today()))}
function rangeFor(p){
  const t=today();
  if(p==='all')return null;
  if(p==='thism')return [iso(new Date(t.getFullYear(),t.getMonth(),1)),iso(new Date(t.getFullYear(),t.getMonth()+1,0))];
  if(p==='lastm')return [iso(new Date(t.getFullYear(),t.getMonth()-1,1)),iso(new Date(t.getFullYear(),t.getMonth(),0))];
  if(p==='fy')return rangeFor('fy:'+curFY());
  if(p==='lastfy')return rangeFor('fy:'+(curFY()-1));
  if(p.startsWith('fy:')){const y=Number(p.slice(3));return [`${y-1}-07-01`,`${y}-06-30`]}
  if(p.startsWith('cy:')){const y=Number(p.slice(3));return [`${y}-01-01`,`${y}-12-31`]}
  if(p==='custom')return [rOpt.from||'0000-01-01',rOpt.to||'9999-12-31'];
  return null;
}
function periodLabel(p){
  const r=rangeFor(p);
  if(!r)return 'All time';
  if(p==='fy'||p==='lastfy'||p.startsWith('fy:'))return `${fyLabel(Number(r[1].slice(0,4)))} (${fd(r[0])} to ${fd(r[1])})`;
  if(p.startsWith('cy:'))return `Calendar year ${p.slice(3)}`;
  if(p==='thism'||p==='lastm')return pd(r[0]).toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  return `${rOpt.from?fd(rOpt.from):'Start'} to ${rOpt.to?fd(rOpt.to):'today'}`;
}

/* ---------- payoff forecast ---------- */
function amort(bal,rate,R,extra=0,lump=0){let b=bal-lump,m=0,int=0;const i=rate/100/12;if(b<=0)return {m:0,int:0};if(R+extra<=b*i+0.005)return null;while(b>0.005&&m<720){const it=b*i;int+=it;b=b+it-R-extra;m++}return {m,int}}
function openForecast(){const c=C(),L=loanState(c);
  if(!(L.bal>0)||!L.R){openForm({title:'Payoff forecast',noSave:1,fields:[{id:'x',type:'html',html:'<div class="empty">Add the loan amount, rate and monthly repayment in Setup → Loan setup first.</div>'}]});return}
  const fields=[{id:'extra',label:'Extra each month ($)',type:'number',value:0,half:1},{id:'lump',label:'One-off extra now ($)',type:'number',value:0,half:1},{id:'out',type:'html',html:''}];
  const show=f=>{const {vals}=readForm(f,fields);const base=amort(L.bal,L.rate,L.R),w=amort(L.bal,L.rate,L.R,num(vals.extra),num(vals.lump));
    const end=m=>fd(iso(addMonths(today(),m,1))),yrs=m=>`${Math.floor(m/12)} yr ${m%12} mo`;
    $('#f_out').innerHTML=!base?'<div class="empty">The repayment doesn\'t cover the interest, so the loan never gets paid off.</div>':`<div class="shkpis">
      <div class="shk"><small>Balance now</small><b>${m0(L.bal)}</b></div><div class="shk"><small>Rate · repayment</small><b>${fpct(L.rate)} · ${m0(L.R)}</b></div>
      <div class="shk"><small>Paid off (current pace)</small><b>${end(base.m)}</b><em>${yrs(base.m)}</em></div><div class="shk"><small>Interest to pay</small><b>${m0(base.int)}</b></div>
      ${w&&(num(vals.extra)||num(vals.lump))?`<div class="shk ok"><small>Paid off with extra</small><b>${end(w.m)}</b><em>${yrs(base.m-w.m)} sooner</em></div><div class="shk ok"><small>Interest saved</small><b>${m0(base.int-w.int)}</b></div>`:''}</div>
      <p class="muted small">Assumes today's rate stays the same. Per share, the repayment is ${m2(L.R/4)} a month.</p>`};
  openForm({title:'Payoff forecast',noSave:1,noFocus:1,fields,onInput:show});setTimeout(()=>show($('#form')),0)}
/* ---------- rate change tool ---------- */

        if(x.from&&x.from>=v.date){x.amount=amt}else{x.until=prev;c.plans.push({...x,id:uid(),from:v.date,until:'',amount:amt,note:(x.note?x.note+' · ':'')+'after rate change'})}changed.push(x.personId||'s'+x.shareId)})}

      return {p,text:`Hi ${p.name},\n\nThe interest rate on the ${c.name} loan changes to ${fpct(num(v.rate))} p.a. from ${fd(v.date)}.\n\n${tot?`Your new monthly amount is ${m2(tot)} (${pl.map(x=>x.cat+' '+m2(x.amount)).join(', ')}).`:'Your monthly amount will be confirmed separately.'}\n\nPlease update any automatic transfers.\n\nThis message is just for you.\n\nKind regards,\n${c.name}`}});mailPeople(c,list,'Interest rate change','rate')},400)}});

/* ---------- bank statement import ---------- */
function parseCsv(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function csvDate(s){s=String(s).trim();let m;if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/)){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}
  const d=new Date(s);return isNaN(d)?'':iso(d)}
function csvNum(s){const t=String(s||'').replace(/[$,\s]/g,'');if(!t)return 0;const neg=/^\(.*\)$/.test(t)||/-/.test(t)||/DR$/i.test(t);const v=parseFloat(t.replace(/[()\-]|CR|DR/gi,''));return isNaN(v)?0:(neg?-v:v)}
let importRows=[];
function readBankCsv(c,text){const R=parseCsv(text);if(!R.length)return [];const h=R[0].map(x=>x.toLowerCase());const hasHead=h.some(x=>/date|amount|desc|narr|detail|credit|debit|transaction/.test(x));
  const col=re=>h.findIndex(x=>re.test(x));let di=0,ai=1,ti=2,ci=-1,dbi=-1,body=R;
  if(hasHead){body=R.slice(1);di=Math.max(0,col(/date/));ai=col(/^amount|amount/);ci=col(/credit|deposit|money in/);dbi=col(/debit|withdraw|money out/);ti=col(/desc|narr|detail|transaction|memo|particular|reference/);if(ti<0)ti=h.findIndex((x,i)=>i!==di&&i!==ai&&i!==ci&&i!==dbi)}
  const people=c.shareholders.map(p=>({p,toks:String(p.name).toLowerCase().split(/\s+/).filter(t=>t.length>=3)}));
  return body.map(r=>{const date=csvDate(r[di]);let amt=ai>=0?csvNum(r[ai]):0;if(ci>=0&&csvNum(r[ci]))amt=Math.abs(csvNum(r[ci]));else if(dbi>=0&&csvNum(r[dbi]))amt=-Math.abs(csvNum(r[dbi]));
    const desc=(r[ti]||'').trim(),dl=desc.toLowerCase();let best=null,sc=0;people.forEach(x=>{const s2=x.toks.filter(t=>dl.includes(t)).length;if(s2>sc){sc=s2;best=x.p}});
    const cat=/interest/i.test(desc)?'Interest':/deposit/i.test(desc)?'Deposit':/council|water|rates|insur|outgo/i.test(desc)?'Outgoings':'Principal';
    const dup=best&&c.contributions.some(x=>x.date===date&&Math.abs(num(x.amount)-amt)<0.005&&shareOf(c,x)===best.share);
    return {id:uid(),date,amt,desc,pid:best?best.id:'',cat,on:!!best&&!dup,dup}}).filter(r=>r.date&&r.amt>0)}
function importTable(c){const opts=c.shareholders.map(p=>`<option value="${p.id}">${esc(p.name)} (Share ${p.share})</option>`).join('');
  return importRows.length?`<p class="muted small">${importRows.length} money-in rows found. ${importRows.filter(r=>r.on).length} matched to a shareholder. Check each one, then tap Add selected.</p><div class="imp">${importRows.map(r=>`<div class="impr${r.dup?' dup':''}">
    <label class="impc"><input type="checkbox" data-imp="${r.id}" data-k="on" ${r.on?'checked':''}><span><b>${m2(r.amt)}</b> · ${fd(r.date)}<small>${esc(r.desc||'No description')}${r.dup?' · looks already recorded':''}</small></span></label>
    <div class="impsel"><select data-imp="${r.id}" data-k="pid"><option value="">Who paid?</option>${opts.replace(`value="${r.pid}"`,`value="${r.pid}" selected`)}</select>

function openImport(){const c=C();importRows=[];

function pStatus(due,paid,dueIso){const t=iso(today());
  if(due<=0.005)return paid>0.005?{k:'paid',l:'Extra'}:{k:'none',l:'—'};
  if(paid>=due-0.005)return {k:'paid',l:paid>due+0.005?'Extra':'Paid'};
  const late=dueIso&&dueIso<t;if(paid>0.005)return {k:'part',l:'Part paid'};
  return late?{k:'late',l:'Overdue'}:{k:'due',l:'Due'}}

function pStanding(c,p){const plans=pPlans(c,p),pays=pPays(c,p);if(!plans.length)return null;const now=ymOf(iso(today()));
  const start=plans.map(x=>ymOf(x.from)||now).sort()[0];let due=0;for(let k=start;k<=now;k=addYm(k,1))due+=sum(plans,x=>planDue(x,k));
  const cats=[...new Set(plans.map(x=>x.cat))];const paid=sum(pays.filter(x=>cats.includes(catOf(x))&&ymOf(x.date)>=start),x=>x.amount);return {due,paid,diff:paid-due}}
function pNext(c,p){const plans=pPlans(c,p),t=iso(today());if(!plans.length)return null;
  for(let k=ymOf(t),n=0;n<13;k=addYm(k,1),n++){const S=statement(c,p,k);const left=S.due-S.paid;
    if(left>0.005){const day=S.rows.filter(r=>r.day&&r.paid<r.due-0.005).map(r=>r.day).sort((a,b)=>a-b)[0]||S.rows.filter(r=>r.day).map(r=>r.day).sort((a,b)=>a-b)[0]||1;
      const d=`${k}-${String(Math.min(28,day)).padStart(2,'0')}`;return {date:d,amount:left,days:Math.round((pd(d)-pd(t))/86400000)}}}return null}

function pCal(c,p,ym){const [y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),lead=(first.getDay()+6)%7,t=iso(today());
  const plans=pPlans(c,p).filter(x=>planDue(x,ym)),pays=pPays(c,p).filter(x=>ymOf(x.date)===ym);
  const cells=[];for(let i=0;i<lead;i++)cells.push('<span></span>');
  for(let d=1;d<=days;d++){const di=`${ym}-${String(d).padStart(2,'0')}`;const due=plans.filter(x=>Math.min(28,x.day||1)===d);

    cells.push(`<span class="pcd${di===t?' today':''}">${d}${dot?`<i class="dot ${dot}"></i>`:''}${paidDay?'<i class="tick">✓</i>':''}</span>`)}

function pYear(c,p){const now=iso(today()),e=fyOf(now),months=[];for(let k=`${e-1}-07`;k<=`${e}-06`;k=addYm(k,1))months.push(k);
  const plans=pPlans(c,p),pays=pPays(c,p);const data=months.map(k=>({k,due:sum(plans,x=>planDue(x,k)),paid:sum(pays.filter(q=>ymOf(q.date)===k),q=>q.amount)}));

function shrinkImage(file){return new Promise(res=>{if(!/^image\//.test(file.type)){res(null);return}const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(b=>res(b),'image/jpeg',.82)};img.onerror=()=>res(null);img.src=u})}

/* ---------- monthly statements per person ---------- */
const ST_LABEL={paid:'Paid',partial:'Partly paid',none:'Not paid',extra:'Extra paid',noplan:'No monthly amount'};
const ST_CHIP={paid:'ok',partial:'warn',none:'bad',extra:'info',noplan:''};
function ymOf(d){return d?d.slice(0,7):''}
function mRange(ym){const [y,m]=ym.split('-').map(Number);const f=`${ym}-01`,l=iso(new Date(y,m,0));return [f,l]}
function addYm(ym,k){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ymLabel(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'})}
function pPlans(c,p){const single=c.shareholders.filter(q=>q.share===p.share).length===1;return c.plans.filter(x=>Number(x.shareId)===p.share&&(x.personId===p.id||(!x.personId&&single)))}
function pPays(c,p){const single=c.shareholders.filter(q=>q.share===p.share).length===1;return c.contributions.filter(x=>shareOf(c,x)===p.share&&(x.personId===p.id||(!x.personId&&single)))}
function planDue(x,ym){const [f,l]=mRange(ym);return (!x.from||x.from<=l)&&(!x.until||x.until>=f)?num(x.amount):0}
function stOf(due,paid){return due<=0.005&&paid<=0.005?'noplan':paid<=0.005?'none':paid<due-0.005?'partial':paid>due+0.005?'extra':'paid'}
function statement(c,p,ym){
  const plans=pPlans(c,p),pays=pPays(c,p),[f,l]=mRange(ym);
  const rows=SH_CATS.map(cat=>{const pl=plans.filter(x=>x.cat===cat);const due=sum(pl,x=>planDue(x,ym));const paid=sum(pays.filter(x=>catOf(x)===cat&&x.date>=f&&x.date<=l),x=>x.amount);
    const day=pl.find(x=>planDue(x,ym))?.day||null;return {cat,due,paid,day,st:stOf(due,paid)}}).filter(r=>r.due>0||r.paid>0);
  // earlier months: only categories with a plan, from that plan's first month
  let earlier=0;SH_CATS.forEach(cat=>{const pl=plans.filter(x=>x.cat===cat);if(!pl.length)return;const start=pl.map(x=>ymOf(x.from)||ym).sort()[0];
    for(let k=start;k<ym;k=addYm(k,1)){earlier+=sum(pl,x=>planDue(x,k))-sum(pays.filter(x=>catOf(x)===cat&&ymOf(x.date)===k),x=>x.amount)}});
  const due=sum(rows,r=>r.due),paid=sum(rows,r=>r.paid);
  return {p,rows,due,paid,diff:paid-due,earlier,st:stOf(due,paid)};
}
function stText(c,S,ym){const p=S.p,fmt=v=>m2(Math.abs(v));
  const lines=[`Hi ${p.name},`,'',`Here is your ${c.name} payment summary for ${ymLabel(ym)} (Share ${p.share}).`,''];
  S.rows.forEach(r=>lines.push(`${r.cat}: due ${m2(r.due)}${r.day?' (on the '+r.day+(['th','st','nd','rd'][(r.day%100-20)%10]||['th','st','nd','rd'][r.day%100]||'th')+')':''}, paid ${m2(r.paid)} – ${ST_LABEL[r.st]}`));
  if(!S.rows.length)lines.push('No monthly payment is set for you this month.');
  lines.push('',`Total due: ${m2(S.due)}`,`Total paid: ${m2(S.paid)}`);
  if(S.diff<-0.005)lines.push(`Still to pay this month: ${fmt(S.diff)}`);else if(S.diff>0.005)lines.push(`Extra paid this month: ${fmt(S.diff)}`);else if(S.due>0)lines.push('This month is fully paid. Thank you.');
  if(S.earlier>0.005)lines.push(`Still owing from earlier months: ${fmt(S.earlier)}`);else if(S.earlier<-0.005)lines.push(`Paid ahead from earlier months: ${fmt(S.earlier)}`);
  lines.push('','This summary is just for you.','',`Kind regards,`,c.name);return lines.join('\n')}

      {empty:'Add shareholders on the Setup page first.',foot:['Total','',m2(sum(list,S=>S.due)),m2(sum(list,S=>S.paid)),'']})}
    <p class="muted small" style="margin-top:10px">Set each person's monthly amounts by tapping their name on the Shares tab. Each message only shows that person's own amounts.</p>
  </section></div>`;
}

function devName(){const u=navigator.userAgent;return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows PC':'Browser'}
function audit(what){const c=state[cur];if(!c||!c.audits)return;c.audits.push({id:uid(),t:new Date().toISOString(),what:String(what||'Change'),dev:devName()});if(c.audits.length>300)c.audits.splice(0,c.audits.length-300)}

function u8b64(buf){let bin='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=32768)bin+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(bin)}
async function saveFile(data,name,mime){const file=new File([data],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}

function msgsFor(c,pid){return c.messages.filter(m=>(m.recipients||[]).some(r=>r.personId===pid))}
function fileSafe(s){return String(s).replace(/[^\w\- ]+/g,'').replace(/\s+/g,' ').trim().slice(0,80)}
async function mailPeople(c,list,subject,source,attachment){ // list: [{p,text}]

/* statement PDF */
function periodRange(c,p,per){const t=today(),ymNow=ymOf(iso(t));

  const ds=[...pPlans(c,p).map(x=>x.from).filter(Boolean),...pPays(c,p).map(x=>x.date).filter(Boolean)].sort();return {f:ds[0]||iso(t),l:iso(t),label:'All time'}}
function statementModel(c,p,per){const R=periodRange(c,p,per),plans=pPlans(c,p),pays=pPays(c,p).filter(x=>x.date>=R.f&&x.date<=R.l).sort(byDate);
  const months=[];for(let k=ymOf(R.f);k<=ymOf(R.l);k=addYm(k,1))months.push(k);
  const rows=SH_CATS.map(cat=>{const due=sum(months,ym=>sum(plans.filter(x=>x.cat===cat),x=>planDue(x,ym)));const paid=sum(pays.filter(x=>catOf(x)===cat),x=>x.amount);return [cat,m2(due),m2(paid),(paid-due>=0?'+':'-')+m2(Math.abs(paid-due)),due,paid]}).filter(r=>r[4]||r[5]);
  const other=sum(pays.filter(x=>catOf(x)==='Other'),x=>x.amount);if(other)rows.push(['Other',m2(0),m2(other),'+'+m2(other),0,other]);
  const due=sum(rows,r=>r[4]),paid=sum(rows,r=>r[5]),S=statement(c,p,ymOf(R.f));
  return {cos:[c],kicker:'STATEMENT',title:'Shareholder statement',sub:`${p.name} · Share ${p.share} · ${R.label}`,made:fd(today()),blocks:[

  'add-stage':()=>formStage(),'edit-stage':d=>formStage(d.id),'add-expense':()=>formWork(),'add-work':()=>formWork(),'add-utility':()=>formUtility(),'edit-expense':d=>{const e=C().expenses.find(x=>x.id===d.id);(e&&e.kind==='utility'?formUtility:formWork)(d.id)},
  'add-reminder':()=>formReminder(),'edit-reminder':d=>formReminder(d.id),'send-reminder':d=>sendReminder(d.id),'compose':formCompose,'view-message':d=>viewMessage(d.id)
};
document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return}
  const t=e.target.closest('[data-act],[data-go],button[data-co]');if(t===document.body)return;if(!t||t.disabled)return;
  if(t.dataset.co&&!t.dataset.act){cur=t.dataset.co;personFilter='all';rOpt.co='current';utilFilter='all';render();window.scrollTo(0,0);return}
  if(t.dataset.go){sec=t.dataset.go;render();window.scrollTo(0,0);return}
  const f=ACTIONS[t.dataset.act];if(f)f(t.dataset);
});
/* ---------- touch gestures ---------- */
let suppressClick=false,tg=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1||!$('#modal').hidden)return;const el=e.target;
  if(el.closest('input,select,textarea,.cgrid'))return;
  const row=el.closest('tr.click');const del=row&&row.querySelector('.delbtn');
  const tw=el.closest('.tw');if(tw&&!del&&tw.scrollWidth>tw.clientWidth+2)return;
  tg={x:e.touches[0].clientX,y:e.touches[0].clientY,row:del?row:null,del,mode:null,inView:!!el.closest('#view')}},{passive:true});
document.addEventListener('touchmove',e=>{if(!tg)return;const dx=e.touches[0].clientX-tg.x,dy=e.touches[0].clientY-tg.y;
  if(!tg.mode){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4)tg.mode=tg.row&&dx<0?'row':(tg.inView?'co':'none');else if(Math.abs(dy)>12)tg.mode='none'}
  if(tg.mode==='row'){const v=Math.min(0,dx);tg.row.style.transform=`translateX(${v}px)`;tg.row.classList.toggle('swiping',v<-80)}},{passive:true});
document.addEventListener('touchend',e=>{if(!tg)return;const t=tg;tg=null;const dx=(e.changedTouches[0]||{}).clientX-t.x;
  if(t.mode==='row'){t.row.style.transform='';t.row.classList.remove('swiping');suppressClick=true;setTimeout(()=>suppressClick=false,350);if(dx<-80)delItem(t.del.dataset.kind,t.del.dataset.id);return}
  if(t.mode==='co'&&Math.abs(dx)>80){const i=COMPANIES.findIndex(x=>x.id===cur),n=COMPANIES[(i+(dx<0?1:-1)+COMPANIES.length)%COMPANIES.length];
    if(n.id!==cur){suppressClick=true;setTimeout(()=>suppressClick=false,350);swipeDir=dx<0?'right':'left';cur=n.id;personFilter='all';rOpt.co='current';utilFilter='all';render()}}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();goBack();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.click')){e.preventDefault();e.target.click()}
});
window.addEventListener('hashchange',()=>{readHash();render()});

/* ---------- saving ---------- */
let statusText='Connecting…';
function setStatus(kind,text){document.body.dataset.sync=kind;statusText=text;const g=$('#gstat');if(g)g.textContent=text;document.querySelectorAll('.gear').forEach(b=>b.title='Settings · '+text)}
function commit(){trackChange();render();if(!db){toast('Not saved: sign in to keep changes');return}queueSave(cur)}
function queueSave(id){clearTimeout(saveTimers[id]);setStatus('busy','Saving…');saveTimers[id]=setTimeout(()=>doSave(id),400)}
const CFG=window.PBK_CONFIG||{};
let authToken=null,authEmail='',versions={};
function tokenExp(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}}
function tokenEmail(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).email||''}catch(e){return ''}}
async function api(action,payload){
  if(!authToken||tokenExp(authToken)<Date.now()+30000){await signIn(true)}
  const r=await fetch(CFG.scriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:authToken,...payload})});
  const j=await r.json();
  if(!j.ok&&j.auth){authToken=null;try{localStorage.removeItem('pbk-token')}catch(e){}await signIn(false);return api(action,payload)}
  return j;
}
let signInWait=null;
function showGate(msg){const g=$('#gate');g.hidden=false;$('#gatemsg').textContent=msg||'';}
function signIn(silent){
  if(signInWait)return signInWait;
  signInWait=new Promise(resolve=>{
    const start=()=>{
      if(!window.google||!google.accounts||!google.accounts.id){setTimeout(start,200);return}
      google.accounts.id.initialize({client_id:CFG.clientId,auto_select:true,cancel_on_tap_outside:false,
        callback:resp=>{authToken=resp.credential;authEmail=tokenEmail(authToken);try{localStorage.setItem('pbk-token',authToken)}catch(e){}
          $('#gate').hidden=true;signInWait=null;resolve()}});
      showGate(silent?'':'Please sign in again to continue.');
      google.accounts.id.renderButton($('#gbtn'),{theme:'filled_blue',size:'large',shape:'pill',text:'signin_with',logo_alignment:'left',width:280});
      google.accounts.id.prompt();
    };start();
  });
  return signInWait;
}
function signOut(){try{localStorage.removeItem('pbk-token')}catch(e){}authToken=null;try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()}
/* ---------- multi-device sync ---------- */
let base={},lastSync=0,retryT=null;
const coOf=id=>COMPANIES.find(x=>x.id===id);
const COLLS=['shareholders','contributions','plans','payments','expenses','stages','reminders','messages','ownership','meetings','audits','requests','docs','announcements'];
const js=x=>JSON.stringify(x===undefined?null:x);
function mergeArr(b,l,r){b=b||[];l=l||[];r=r||[];
  const B=new Map(b.map(x=>[x.id,js(x)])),L=new Map(l.map(x=>[x.id,x])),R=new Map(r.map(x=>[x.id,x]));
  let out=r.map(x=>x);
  for(const [id,bv] of B){if(!L.has(id)&&R.has(id)&&js(R.get(id))===bv)out=out.filter(x=>x.id!==id)}
  for(const x of l){const bv=B.get(x.id),lv=js(x);
    if(bv===undefined){if(!R.has(x.id))out.push(x)}
    else if(bv!==lv){const i=out.findIndex(o=>o.id===x.id);if(i>=0)out[i]=x;else out.push(x)}}
  return out}
function mergeObj(b,l,r,skip){b=b||{};l=l||{};r=r||{};const out={...r};
  new Set([...Object.keys(l),...Object.keys(b)]).forEach(k=>{if(skip&&skip.includes(k))return;if(js(l[k])!==js(b[k]))out[k]=l[k]});return out}
function mergeList(b,l,r){b=b||[];l=l||[];r=r||[];const add=l.filter(x=>!b.includes(x)),del=b.filter(x=>!l.includes(x));return [...new Set([...r,...add])].filter(x=>!del.includes(x))}
function merge3(b,l,r){
  const out=mergeObj(b,l,r,[...COLLS,'land','loan','banks','utilityTypes']);
  COLLS.forEach(k=>out[k]=mergeArr(b[k],l[k],r[k]));
  out.land=mergeObj(b.land,l.land,r.land);
  const bl=b.loan||{},ll=l.loan||{},rl=r.loan||{};
  out.loan={...mergeObj(bl,ll,rl,['rates']),rates:mergeArr(bl.rates,ll.rates,rl.rates)};
  out.banks=mergeList(b.banks,l.banks,r.banks);out.utilityTypes=mergeList(b.utilityTypes,l.utilityTypes,r.utilityTypes);
  return out}
const unsyncedKey='pbk-unsynced';
function readUnsynced(){try{return JSON.parse(localStorage.getItem(unsyncedKey)||'{}')}catch(e){return {}}}
function writeUnsynced(o){try{localStorage.setItem(unsyncedKey,JSON.stringify(o))}catch(e){}}
function markUnsynced(id){const u=readUnsynced();u[id]={data:state[id],base:base[id]||null,version:versions[id]||0,at:Date.now()};writeUnsynced(u)}
function clearUnsynced(id){const u=readUnsynced();delete u[id];writeUnsynced(u)}
function applyRemote(id,data,version){
  state[id]=normalize(data,coOf(id));base[id]=js(state[id]);versions[id]=version;
  shadow[id]=js(state[id]);undoStack=undoStack.filter(u=>u.id!==id);updUndo()}
function syncLabel(){if(!lastSync)return 'All changes saved';const t=new Date(lastSync);return 'Synced '+t.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})}
async function doSave(id){
  if(writing[id]){pending[id]=true;return}
  writing[id]=true;markUnsynced(id);clearTimeout(retryT);
  try{
    for(let attempt=0;attempt<5;attempt++){
      const sent=JSON.parse(js(state[id]));
      setStatus('busy','Syncing…');
      const res=await api('save',{id,data:sent,version:versions[id]||0});
      if(res.ok){versions[id]=res.version;base[id]=js(sent);if(js(state[id])===base[id])clearUnsynced(id);lastSync=Date.now();setStatus('ok',syncLabel());break}
      if(res.conflict){
        const remote=normalize(res.data,coOf(id));
        const merged=normalize(merge3(JSON.parse(base[id]||'{}'),state[id],JSON.parse(js(remote))),coOf(id));
        state[id]=merged;base[id]=js(remote);versions[id]=res.version;shadow[id]=js(merged);
        if($('#modal').hidden)render();
        continue}
      throw new Error(res.error||'save failed')
    }
  }catch(e){setStatus('off','Offline – will sync');retryT=setTimeout(()=>COMPANIES.forEach(co=>{if(readUnsynced()[co.id])queueSave(co.id)}),15000)}
  finally{writing[id]=false;if(pending[id]){pending[id]=false;doSave(id)}}
}
async function reloadAll(){
  const res=await api('load',{});
  if(!res.ok)throw new Error(res.error||'Could not load');
  const un=readUnsynced();
  COMPANIES.forEach(co=>{const x=res.companies[co.id],v=x?x.version:0,d=x&&x.data?x.data:blank(co.id,co.name);
    applyRemote(co.id,d,v);
    const u=un[co.id];
    if(u&&u.data){const loc=normalize(u.data,co);
      state[co.id]=u.version===v?loc:normalize(merge3(u.base?JSON.parse(u.base):JSON.parse(base[co.id]),loc,JSON.parse(base[co.id])),co);
      shadow[co.id]=js(state[co.id]);setTimeout(()=>queueSave(co.id),50)}
  });
  lastSync=Date.now();
}
async function pullUpdates(){
  if(!db||!authToken||document.visibilityState!=='visible')return;
  if(!$('#modal').hidden||Object.values(writing).some(Boolean)||Object.values(pending).some(Boolean)||Object.keys(readUnsynced()).length)return;
  try{
    let vs=null;const r=await api('versions',{});
    if(r.ok&&r.versions)vs=r.versions;
    const changed=vs?COMPANIES.filter(co=>(vs[co.id]||0)!==(versions[co.id]||0)):COMPANIES;
    if(!changed.length){lastSync=Date.now();setStatus('ok',syncLabel());return}
    const res=await api('load',{});if(!res.ok)return;
    if(!$('#modal').hidden||Object.values(writing).some(Boolean)||Object.keys(readUnsynced()).length)return;
    let any=false;
    COMPANIES.forEach(co=>{const x=res.companies[co.id];if(x&&x.version!==(versions[co.id]||0)){applyRemote(co.id,x.data,x.version);any=true}});
    lastSync=Date.now();setStatus('ok',syncLabel());
    if(any){render();toast('Updated with changes from your other device')}
  }catch(e){}
}
setInterval(pullUpdates,20000);
async function checkAppVersion(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
  if(j.version&&j.version!==APP_VERSION&&!document.getElementById('updbar')){const mk=()=>{const b=document.createElement('div');b.className='updbar';b.setAttribute('role','status');b.innerHTML='<span class="ut"><b>New version ready</b><small>Tap to get the latest B KWIK</small></span><button type="button" class="btn sm gold updgo">Update now</button>';return b};
    const b=mk();b.id='updbar';const sc=document.querySelector('.side-clock');sc.parentNode.insertBefore(b,sc);
    const mt=document.querySelector('.mtop');mt.insertBefore(mk(),mt.firstChild);
    document.querySelectorAll('.updgo').forEach(x=>x.onclick=async()=>{try{const regs=await navigator.serviceWorker?.getRegistrations?.();if(regs)for(const g of regs)await g.update();const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(e){}location.reload()})}}catch(e){}}
setInterval(checkAppVersion,120000);window.addEventListener('focus',checkAppVersion);setTimeout(checkAppVersion,5000);
setTimeout(()=>{Object.values(LETTERHEAD).forEach(L=>{imgData(L.first+'?v='+APP_VERSION).catch(()=>{});imgData(L.next+'?v='+APP_VERSION).catch(()=>{})})},6000);
window.addEventListener('focus',()=>pullUpdates());
window.addEventListener('online',()=>{COMPANIES.forEach(co=>{if(readUnsynced()[co.id])queueSave(co.id)});setTimeout(pullUpdates,1500)});
const splashDone=new Promise(res=>setTimeout(res,matchMedia('(prefers-reduced-motion: reduce)').matches?600:3700));
function hideSplash(){const sp=$('#splash');if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),700)}}
(async function init(){
  readHash();render();
  if(!CFG.scriptUrl||!CFG.clientId){await splashDone;hideSplash();showGate('');$('#gatemsg').textContent='Setup is not finished: add the Apps Script link and Google client ID to config.js.';return}
  try{const t=localStorage.getItem('pbk-token');if(t&&tokenExp(t)>Date.now()+60000){authToken=t;authEmail=tokenEmail(t)}}catch(e){}
  if(!authToken){await splashDone;hideSplash();await signIn(true)}
  let who=null;try{who=await api('whoami',{})}catch(e){}
  if(who&&!who.ok&&/NOACCESS|not set up|not allowed/i.test(who.error||'')){await splashDone;hideSplash();showGate('');$('#gatemsg').innerHTML=esc(String(who.error).replace(/^NOACCESS:\s*/,''))+'<br><button type="button" class="gatealt" onclick="signOut()">Use a different account</button>';return}
  if(who&&who.ok&&who.role==='shareholder'){const pr=api('portal',{});await splashDone;hideSplash();startPortal(await pr);return}
  db=true;setStatus('busy','Loading…');
  try{await Promise.all([reloadAll(),splashDone]);hideSplash();setStatus('ok',syncLabel())}
  catch(e){hideSplash();setStatus('off','Could not load saved data');toast('Could not load your data: '+e.message)}
  finally{loaded=true;render()}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullUpdates()});
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
</script>
