<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project B KWIK</title>
<meta name="theme-color" content="#1b2e38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="B KWIK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* palette: navy + gold, the owner's theme */
  --navy:#0f2342; --navy-2:#1c3763; --gold:#c9a24a; --gold-soft:#f5ecd3; --gold-ink:#7c5e17;
  --paper:#f3f5f9; --card:#ffffff; --ink:#15213a; --muted:#5b687e; --line:#dfe3ec;
  --good:#1d7349; --good-bg:#e2f2e9; --warn:#8f5a00; --warn-bg:#fcefd2; --bad:#b0271f; --bad-bg:#fbe3e1;
  --display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
  /* layout: laptop = navy sidebar of sections + two company tabs on top; phone = company tabs on top + bottom section bar */
}
/* company themes, three colours each + light tinted page:
   B IN DALBY = Teal (deep slate, teal, aqua) · KWIK TRIP = Sapphire (midnight, sapphire, periwinkle) */
body{
  --navy:#1b2e38; --navy-2:#2a4552; --gold:#5fa0b0; --gold-soft:#dff0f3; --gold-ink:#2c6977;
  --third:#8ecfdc; --third-soft:#e4f4f7; --paper:#d3e7ec; --line:#c4dae0; --cardtint:#f5fafb;
  --muted:#526a72; --ink:#15262d; --notice-line:#b9dde5; --gold-hover:#74b2c1;
}
body[data-co="kwik"]{
  --navy:#151f38; --navy-2:#243257; --gold:#6a8fd4; --gold-soft:#e2e9f8; --gold-ink:#34539a;
  --third:#9fb9e8; --third-soft:#e8eefa; --paper:#d6e0f3; --line:#c9d4ea; --cardtint:#f6f8fd;
  --muted:#56627c; --ink:#141d33; --notice-line:#c3d2ef; --gold-hover:#7d9edc;
}
.ctab[data-co="dalby"]{--tab:#1b2e38;--tabacc:#5fa0b0}
.ctab[data-co="kwik"]{--tab:#151f38;--tabacc:#6a8fd4}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:400 30px/1.15 var(--display);color:var(--navy)}
h2{font:600 15px/1.3 var(--body);color:var(--navy)}
h3{font:600 14px/1.3 var(--body)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:#e9edf5;padding:24px 14px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.mark{width:38px;height:38px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:400 17px var(--display);flex:none}
.brand b{display:block;font-size:14px;color:#fff;letter-spacing:.4px}
.brand small{color:#9fb0cc;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:#c9d3e6;padding:10px 12px;border-radius:8px;text-align:left;font-weight:500}
.nav button:hover{background:var(--navy-2);color:#fff}
.nav button[aria-current="page"]{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg,.bnav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.status{margin-top:auto;font-size:12px;color:#9fb0cc;padding:0 8px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#9fb0cc;flex:none}
.dot.ok{background:#5bc48c}.dot.busy{background:var(--gold)}.dot.off{background:#e98a82}

main{padding:0 32px 56px;min-width:0}
.mtop{display:none}
.ctabs{position:sticky;top:0;z-index:5;background:var(--paper);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 0 14px;max-width:1180px}
.ctab{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;justify-content:center;text-align:left;display:flex;flex-direction:column;min-width:0}
.ctab b{font-weight:700;font-size:15px;letter-spacing:1.2px}
.ctab small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctab{border-left:5px solid var(--tabacc)}
.ctab b{color:var(--tab)}
.ctab[aria-selected="true"]{background:var(--tab);border-color:var(--tab);border-left-color:var(--tabacc);color:#fff;box-shadow:inset 0 -3px 0 var(--tabacc)}
.ctab[aria-selected="true"] b{color:#fff}
.ctab[aria-selected="true"] small{color:#c4cfe3}

.view{max-width:1180px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;border-top:4px solid var(--gold)}
.hero > div{min-width:0}
.eyebrow{margin:0 0 4px;color:var(--gold-ink);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.addr{margin:6px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:#eef1f6;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.chip.navy{background:var(--navy);color:#fff}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font:500 22px/1.2 var(--mono);color:var(--navy);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:#e8ebf1;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.span2{grid-column:1/-1}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#bfc7d6}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold:hover{background:var(--gold-hover)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#efc3bf;background:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.link{background:none;border:0;color:var(--navy-2);font-weight:600;font-size:13px;padding:4px;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:4px}
.pagehead p{margin-top:4px;max-width:64ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #eef0f5;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7f8fb}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:14px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:8px 16px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px}
dl.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

.shares{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.share{display:flex;flex-direction:column;gap:8px}
.share h3{display:flex;justify-content:space-between;align-items:baseline}
.share h3 span{font:500 13px var(--mono);color:var(--gold-ink)}
.member{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#f6f7fa;border:1px solid transparent;border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.member:hover{border-color:var(--line)}
.member b{display:block;font-weight:600;font-size:14px}
.member small{color:var(--muted);font-size:12px}
.member .pct{font:500 13px var(--mono);color:var(--navy)}

.sbars{display:flex;flex-direction:column;gap:12px}
.sbar{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.sbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.track{position:relative;height:10px;background:#eceff4;border-radius:5px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:5px}
.track u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--gold);border-radius:2px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--navy)}
.legend i.g{width:3px;height:12px;background:var(--gold)}

.uprow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f5}
.uprow:last-child{border-bottom:0}
.datebox{width:48px;flex:none;text-align:center;border-radius:8px;background:var(--gold-soft);color:var(--gold-ink);padding:5px 0;line-height:1.1}
.datebox b{display:block;font:500 18px var(--mono);color:var(--navy)}
.datebox small{font-size:11px;text-transform:uppercase;font-weight:700}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:600}

.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stage{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fbfbfd;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.stage:hover{border-color:#bfc7d6}
.stage .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}

.rem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 0;border-bottom:1px solid #eef0f5;align-items:center}
.rem:last-child{border-bottom:0}
.rem .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rem.paused{opacity:.6}
.notice{background:var(--gold-soft);border:1px solid var(--notice-line);color:var(--gold-ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.info{background:#e9eef7;border-color:#cdd8ea;color:#203658}

svg.chart{width:100%;height:auto;display:block}
.axis{font:11px var(--body);fill:var(--muted)}
.axis.v{font-family:var(--mono)}

#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,20,40,.45)}
.sheet{position:relative;background:var(--card);width:min(580px,calc(100% - 32px));max-height:calc(100% - 48px);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(10,20,40,.3)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet h2{font:400 22px var(--display)}
.fbody{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.fbody > *{grid-column:1/-1}
.fbody > .field.half{grid-column:auto}
.field{display:flex;flex-direction:column;gap:4px;border:0;padding:0;margin:0;min-width:0}
.field label,.field legend{font-size:13px;font-weight:600;padding:0}
input,select,textarea{font:inherit;font-size:16px;padding:9px 11px;border:1px solid #cbd2de;border-radius:9px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical}
.hint{color:var(--muted);font-size:12px}
.checks{display:flex;gap:16px;flex-wrap:wrap;padding-top:4px}
.check{display:flex;gap:6px;align-items:center;font-size:14px}
.check input{width:18px;height:18px}
.ferr{color:var(--bad);font-size:13px}
.ferr:empty{display:none}
.preview{background:#f6f7fa;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap}
.sheet footer{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.sp{flex:1}
.icon-btn{background:none;border:0;font-size:26px;line-height:1;padding:2px 8px;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:10px}
.ritem{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ritem p{white-space:pre-wrap;font-size:13px;margin-top:6px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(10,20,40,.3);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.bnav{display:none}
.loading{padding:40px 0;color:var(--muted)}


/* three-colour accents */
body{transition:background-color .25s}
.kpis .kpi{border-top:4px solid var(--navy)}
.kpis .kpi:nth-child(3n+2){border-top-color:var(--gold)}
.kpis .kpi:nth-child(3n+3){border-top-color:var(--third)}
.ch h2{display:flex;align-items:center;gap:8px}
.ch h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--third);flex:none}
.hero{background:linear-gradient(120deg,var(--card) 55%,var(--third-soft))}
th{background:var(--third-soft)}
th:first-child{border-radius:8px 0 0 8px} th:last-child{border-radius:0 8px 8px 0}
.chip{background:var(--third-soft);color:var(--ink)}
.member{background:var(--cardtint);border-color:var(--line)}
.share{border-top:4px solid var(--third)}
.stage{background:var(--cardtint)}
.track{background:var(--third-soft)}
.bar{background:var(--third-soft)}
.empty{background:var(--cardtint)}
.side .mark,.mtop .mark{box-shadow:0 0 0 3px var(--third)}
.nav button[aria-current="page"] svg{color:var(--third)}
@media (max-width:600px){th{background:none}}

/* glass look: soft colour glow behind see-through panels */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(40rem 30rem at 8% 0%, color-mix(in srgb,var(--third) 70%,transparent), transparent 70%),
    radial-gradient(36rem 28rem at 100% 15%, color-mix(in srgb,var(--gold) 55%,transparent), transparent 70%),
    radial-gradient(44rem 34rem at 60% 100%, color-mix(in srgb,var(--navy-2) 35%,transparent), transparent 70%),
    var(--paper)}
body{background:var(--paper)}
.card,.kpi,.ctab,.notice,.stage,.member,.empty{
  background:color-mix(in srgb,var(--glass) 52%,transparent)!important;
  -webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);
  border-color:color-mix(in srgb,var(--glass) 70%,transparent)!important;
  box-shadow:0 6px 24px color-mix(in srgb,var(--navy) 10%,transparent), inset 0 1px 0 color-mix(in srgb,var(--glass) 80%,transparent)}
.hero{background:linear-gradient(120deg,color-mix(in srgb,var(--glass) 60%,transparent) 50%,color-mix(in srgb,var(--third) 30%,transparent))!important}
.kpis .kpi{border-top-width:4px;border-top-style:solid}
.kpis .kpi{border-top-color:var(--navy)!important}
.kpis .kpi:nth-child(3n+2){border-top-color:var(--gold)!important}
.kpis .kpi:nth-child(3n+3){border-top-color:var(--third)!important}
.share{border-top:4px solid var(--third)!important}
.hero{border-top:4px solid var(--gold)!important}
.side,.bnav{background:color-mix(in srgb,var(--navy) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.ctabs{background:transparent}
th{background:color-mix(in srgb,var(--third) 22%,transparent)}
.sheet{background:color-mix(in srgb,var(--glass) 85%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.scrim{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
/* centred company tabs + press-in effect */
.ctab{align-items:center;text-align:center;border-left-width:1px!important;border-bottom:4px solid var(--tabacc)!important}
.ctab[aria-selected="true"]{background:color-mix(in srgb,var(--tab) 88%,transparent)!important;border-color:var(--tab)!important;border-bottom-color:var(--tabacc)!important;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.35), inset 0 -2px 0 var(--tabacc)!important;transform:translateY(2px)}
button,.member,.stage,tr.click{transition:transform .08s ease, box-shadow .12s ease, filter .12s}
button:active,.member:active,.stage:active{transform:translateY(2px) scale(.98);filter:brightness(.96);box-shadow:inset 0 3px 8px rgba(0,0,0,.18)!important}
.ctab:active{transform:translateY(3px) scale(.98)}
.btn{box-shadow:0 2px 0 color-mix(in srgb,var(--navy) 18%,transparent)}
.btn:active{box-shadow:inset 0 2px 6px rgba(0,0,0,.22)}
.bnav button:active,.nav button:active{transform:scale(.94)}

/* clearer, more see-through tinted glass */
body::before{background:
    radial-gradient(38rem 30rem at 5% 0%, color-mix(in srgb,var(--third) 95%,transparent), transparent 70%),
    radial-gradient(34rem 28rem at 100% 10%, color-mix(in srgb,var(--gold) 80%,transparent), transparent 70%),
    radial-gradient(40rem 32rem at 30% 70%, color-mix(in srgb,var(--third) 55%,transparent), transparent 70%),
    radial-gradient(44rem 34rem at 85% 100%, color-mix(in srgb,var(--navy-2) 55%,transparent), transparent 70%),
    var(--paper)!important}
.card,.kpi,.ctab,.notice,.stage,.member,.empty{
  background:linear-gradient(135deg,color-mix(in srgb,var(--glass) 38%,transparent),color-mix(in srgb,var(--third) 14%,transparent))!important;
  -webkit-backdrop-filter:blur(7px) saturate(170%);backdrop-filter:blur(7px) saturate(170%);
  border-color:color-mix(in srgb,var(--glass) 65%,transparent)!important;
  box-shadow:0 8px 28px color-mix(in srgb,var(--navy) 14%,transparent), inset 0 1px 0 color-mix(in srgb,var(--glass) 90%,transparent), inset 0 -1px 0 color-mix(in srgb,var(--third) 30%,transparent)!important}
.member,.stage,.empty{background:color-mix(in srgb,var(--glass) 28%,transparent)!important}
.hero{background:linear-gradient(120deg,color-mix(in srgb,var(--glass) 42%,transparent) 45%,color-mix(in srgb,var(--third) 28%,transparent))!important}
.ctab[aria-selected="true"]{background:color-mix(in srgb,var(--tab) 72%,transparent)!important}
.side,.bnav{background:color-mix(in srgb,var(--navy) 70%,transparent)!important;-webkit-backdrop-filter:blur(10px) saturate(170%);backdrop-filter:blur(10px) saturate(170%)}
.side{border-right:1px solid color-mix(in srgb,var(--glass) 25%,transparent)}
th{background:color-mix(in srgb,var(--third) 18%,transparent)}
.chip{background:color-mix(in srgb,var(--third) 25%,transparent)}
.track,.bar{background:color-mix(in srgb,var(--glass) 45%,transparent)}
.sheet{background:color-mix(in srgb,var(--glass) 72%,transparent)!important;-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
input,select,textarea{background:color-mix(in srgb,var(--glass) 75%,transparent)}
@media (max-width:1150px){.shares{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){

<script>
/* ---------- constants ---------- */
const COMPANIES=[
  {id:'dalby',name:'B IN DALBY'},
  {id:'kwik',name:'KWIK TRIP'}
];
const ICONS={
  overview:'<rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/>',
  holders:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.2 4.6 1.9 5.3 4.9"/>',
  mortgage:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/>',
  outgoings:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6.2 4.6 1.9 5.3 4.9"/>',
  loan:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/>',
  costs:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  messages:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  reports:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-3M20 16V6"/>'
};
const SECTIONS=[
  {id:'overview',label:'Dashboard'},
  {id:'holders',label:'Shareholders'},
  {id:'mortgage',label:'Mortgage'},
  {id:'outgoings',label:'Outgoings'},
  {id:'reports',label:'Reports'}
];
const UTIL_TYPES=['Electricity','Gas','Water','Sewerage','Council rates','Land tax','Emergency services levy','Fire services levy','Stormwater','Trade waste','Waste and rubbish','Internet','Phone','Insurance','Strata / body corporate','Security and alarm','Pest control','Cleaning','Maintenance and repairs','Landscaping and gardening'];
const LEGACY_UTIL=new Set(['Council rates','Water','Land tax','Insurance']);
const WORK_CATS=['Stamp duty','Legal & conveyancing','DA Approvals & permits','Architect and design','Engineering','Surveying','Consultants','Earthworks','Construction','Materials','Labour','Equipment hire','Other'];
const PAY_TYPES=[['regular','Regular repayment (principal + interest)'],['extra','Extra payment (principal only)'],['interest','Interest-only payment'],['fee','Bank fee or charge']];
const payTypeLabel=t=>({regular:'Regular',extra:'Extra principal',interest:'Interest only',fee:'Bank fee'}[t||'regular']||'Regular');
const COMMON_BANKS=['Commonwealth Bank','Westpac','NAB','ANZ','Macquarie Bank','Bank of Queensland','Suncorp Bank','Bendigo Bank','ING','St.George','Heritage and People\'s Choice','Great Southern Bank','HSBC','Judo Bank','Bankwest','AMP Bank','Rabobank'];
const CONTRIB_TYPES=['Deposit','Loan repayment','Expense','Construction','Other'];
const EXP_CATS=['Stamp duty','Legal & conveyancing','Council rates','Water','Land tax','Insurance','DA Approvals & permits','Construction','Consultants','Other'];
const STAGE_STATUS=['Planning','Approved','In progress','Done','On hold'];
const FREQS=[['once','One-off'],['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly'],['quarterly','Quarterly'],['yearly','Yearly']];
const REM_TYPES=['Loan repayment','Council rates','Water','Land tax','Insurance','Construction payment','Meeting','Other'];
const CHANNELS=[['email','Email'],['sms','SMS'],['whatsapp','WhatsApp']];
const AUDIENCES=[['all','All shareholders'],['s1','Share 1'],['s2','Share 2'],['s3','Share 3'],['s4','Share 4']];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const sum=(a,f)=>a.reduce((s,x)=>s+num(f?f(x):x),0);
const AUD0=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0});
const AUD2=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>AUD0.format(Math.round(num(n)));
const m2=n=>AUD2.format(num(n));
const mk=n=>{n=num(n);const a=Math.abs(n);return a>=1e6?'$'+(n/1e6).toFixed(a>=1e7?0:2).replace(/\.?0+$/,'')+'M':a>=1e3?'$'+Math.round(n/1e3)+'k':'$'+Math.round(n)};
const fN=(n,dp=0)=>num(n).toLocaleString('en-AU',{maximumFractionDigits:dp});
const fpct=n=>(Math.round(num(n)*100)/100).toLocaleString('en-AU',{maximumFractionDigits:2})+'%';
const pd=s=>{if(!s||typeof s!=='string')return null;const [y,m,d]=s.split('-').map(Number);if(!y)return null;return new Date(y,(m||1)-1,d||1)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fd=s=>{const d=typeof s==='string'?pd(s):s;return d?d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'—'};
const monthYear=d=>d.toLocaleDateString('en-AU',{month:'short',year:'numeric'});
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dayDiff=(a,b)=>Math.round((b-a)/86400000);
const uid=()=>Math.random().toString(36).slice(2,10);
const byDate=(a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:0;
function addMonths(d,n,day){const t=new Date(d.getFullYear(),d.getMonth()+n,1);const dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day??d.getDate(),dim));return t}
function addFreq(s,f){const d=pd(s)||today();switch(f){case 'weekly':d.setDate(d.getDate()+7);return iso(d);case 'fortnightly':d.setDate(d.getDate()+14);return iso(d);case 'monthly':return iso(addMonths(d,1));case 'quarterly':return iso(addMonths(d,3));case 'yearly':return iso(addMonths(d,12));default:return ''}}
const freqLabel=f=>(FREQS.find(x=>x[0]===f)||['','—'])[1];
const audLabel=a=>(AUDIENCES.find(x=>x[0]===a)||['','All shareholders'])[1];
const chLabel=c=>(CHANNELS.find(x=>x[0]===c)||['',c])[1];

/* ---------- state ---------- */
let state={};
let cur='dalby', sec='overview', personFilter='all', ovTab='overview', lsTab='loans', rPeriod='all', mTab='principal', oTab='utilities', utilFilter='all';
let db=null, loaded=false;
const saveTimers={}, writing={}, pending={};

function defaultPeople(){
  const out=[];let k=1;
  [[1,1],[2,1],[3,3],[4,3]].forEach(([s,n])=>{for(let i=0;i<n;i++){out.push({id:uid(),name:`Shareholder ${s}${n>1?String.fromCharCode(65+i):''}`,share:s,email:'',mobile:'',whatsapp:''});k++}});
  return out;
}
const COMPANY_EMAIL={dalby:'bindalbyptyltd@gmail.com',kwik:'kwiktripptyltd@gmail.com'};
function blank(id,name,people){
  return {id,name,purpose:'Land, supermarket and fuel station',abn:'',email:COMPANY_EMAIL[id]||'',sample:false,logo:'',
    land:{address:'',lot:'',size:'',unit:'m2',value:'',purchaseDate:'',settlementDate:''},
    shareholders:people||defaultPeople(),contributions:[],
    loan:{lender:'',principal:'',startDate:'',termYears:25,repayment:'',dueDay:1,rates:[]},
    payments:[],expenses:[],stages:[],reminders:[],messages:[],banks:[],utilityTypes:[]};
}
function normalize(d,c){
  const b=blank(c.id,c.name);
  const o={...b,...d,id:c.id,name:d.name||c.name};
  o.land={...b.land,...(d.land||{})};
  o.loan={...b.loan,...(d.loan||{})};
  if(!Array.isArray(o.loan.rates))o.loan.rates=[];
  ['shareholders','contributions','payments','expenses','stages','reminders','messages','banks','utilityTypes'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
  if(!o.banks.length&&o.loan.lender)o.banks=[o.loan.lender];
  o.payments.forEach(x=>{if(!x.type)x.type='regular';if(x.bank==null)x.bank=o.loan.lender||''});
  o.expenses.forEach(x=>{if(x.category==='Approvals & permits')x.category='DA Approvals & permits';if(!x.kind)x.kind=LEGACY_UTIL.has(x.category)?'utility':'work';if(x.kind==='utility'&&!x.utility)x.utility=x.category});
  if(!o.shareholders.length)o.shareholders=defaultPeople();
  return o;
}
COMPANIES.forEach(c=>state[c.id]=blank(c.id,c.name));
const C=()=>state[cur];
const other=()=>COMPANIES.find(c=>c.id!==cur);

/* ---------- calculations ---------- */
function pctOf(c,p){const n=c.shareholders.filter(x=>x.share===p.share).length||1;return 25/n}
function shareOf(c,x){if(x.shareId)return Number(x.shareId);const p=c.shareholders.find(q=>q.id===x.personId);return p?p.share:0}
function audiencePeople(c,a){if(!a||a==='all')return c.shareholders;const s=Number(a.slice(1));return c.shareholders.filter(p=>p.share===s)}
function rateAt(c,date){const r=[...c.loan.rates].sort(byDate);let v=r.length?num(r[0].rate):0;for(const x of r){if(x.date<=date)v=num(x.rate)}return v}
function currentRate(c){const r=[...c.loan.rates].sort(byDate);return r.length?num(r[r.length-1].rate):0}
function amort(P,ratePct,years){const r=ratePct/100/12,n=years*12;if(!P||!n)return 0;if(!r)return P/n;return P*r/(1-Math.pow(1+r,-n))}
function loanState(c){
  let bal=num(c.loan.principal),ip=0,pp=0,fees=0;const rows=[];
  const od=c.loan.existing==='existing'&&c.loan.openingDate&&c.loan.openingBalance!==''?c.loan.openingDate:null;let opened=!od;
  for(const p of [...c.payments].sort(byDate)){
    if(!opened&&p.date>od){bal=num(c.loan.openingBalance);opened=true}
    const t=p.type||'regular',r=rateAt(c,p.date),amt=num(p.amount);let i=0,pr=0,f=0;
    if(t==='fee')f=amt;
    else if(t==='interest')i=amt;
    else if(t==='extra')pr=Math.min(bal,amt);
    else{const man=p.interestManual!==''&&p.interestManual!=null;i=man?num(p.interestManual):bal*r/100/12;pr=Math.max(0,Math.min(bal,amt-i))}
    bal=Math.max(0,bal-pr);ip+=i;pp+=pr;fees+=f;rows.push({...p,type:t,rate:r,interest:i,principal:pr,fee:f,balance:bal});
  }
  if(!opened)bal=num(c.loan.openingBalance);
  const rate=currentRate(c),R=num(c.loan.repayment),mi=rate/100/12;
  let months=null;const proj=[{m:0,b:bal}];
  if(bal>0&&R>bal*mi){let b=bal,m=0;while(b>0.01&&m<600){b=b*(1+mi)-R;m++;if(m%12===0||b<=0.01)proj.push({m,b:Math.max(0,b)})}months=m}
  return {bal,ip,pp,fees,rows:rows.reverse(),rate,R,months,proj,monthInterest:bal*mi,paidTotal:sum(c.payments,x=>x.amount)};
}
function dueInfo(c){
  const dd=Math.min(28,Math.max(1,num(c.loan.dueDay)||1)),t=today();
  if(!num(c.loan.principal))return null;
  const paidIn=d=>c.payments.some(p=>{if(p.type==='extra'||p.type==='fee')return false;const x=pd(p.date);return x&&x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()});
  let d=new Date(t.getFullYear(),t.getMonth(),dd);
  const start=pd(c.loan.startDate);
  if(paidIn(d)||(start&&d<start))d=addMonths(d,1,dd);
  if(start&&d<start)d=addMonths(start,1,dd);
  return {date:d,days:dayDiff(t,d)};
}
function totals(c){
  const loan=loanState(c);
  const depositReq=Math.max(0,num(c.land.value)-num(c.loan.principal));
  const depositPaid=sum(c.contributions.filter(x=>x.type==='Deposit'),x=>x.amount);
  const expTotal=sum(c.expenses,x=>x.amount);
  const totalCost=depositReq+expTotal+loan.paidTotal;
  const shares=[1,2,3,4].map(n=>({n,members:c.shareholders.filter(p=>p.share===n),paid:sum(c.contributions.filter(x=>shareOf(c,x)===n),x=>x.amount)}));
  return {loan,depositReq,depositPaid,expTotal,totalCost,shares,contribTotal:sum(c.contributions,x=>x.amount)};
}
function dueChip(days){
  if(days==null)return '';

  if(days===0)return '<span class="chip warn">Due today</span>';
  if(days<=7)return `<span class="chip warn">In ${days} day${days===1?'':'s'}</span>`;
  return `<span class="chip">In ${days} days</span>`;
}
function diffChip(d){
  if(Math.abs(d)<1)return '<span class="chip good">Square</span>';
  return d>0?`<span class="chip good">Ahead ${m0(d)}</span>`:`<span class="chip bad">Behind ${m0(-d)}</span>`;

function loanChart(L){

  const W=560,H=sec==="overview"?150:210,pl=48,pr=14,pt=12,pb=24,pts=L.proj,maxM=L.months,maxB=pts[0].b;

  const line=pts.map((p,i)=>`${i?'L':'M'}${x(p.m).toFixed(1)},${y(p.b).toFixed(1)}`).join(' ');
  const area=`${line} L${x(maxM).toFixed(1)},${y(0)} L${x(0)},${y(0)} Z`;
  const start=today().getFullYear(), endD=addMonths(today(),maxM);

}

const RSECS=[['summary','Summary'],['land','Land details'],['loan','Mortgage'],['repayments','Mortgage payment list'],['byshare','Paid in by share'],['payments','Payment list'],['expenses','Outgoings'],['construction','Construction'],['chart','Monthly chart'],['upcoming','Upcoming reminders'],['sent','Messages sent']];
const RPRESETS={
  full:{label:'Full report',secs:RSECS.map(x=>x[0])},
  monthly:{label:'Monthly update',secs:['summary','loan','byshare','expenses','upcoming'],period:'lastm'},
  share:{label:'Share statement',secs:['summary','byshare','payments','loan'],share:'1'},
  loan:{label:'Mortgage statement',secs:['loan','repayments']},
  costs:{label:'Outgoings and construction',secs:['expenses','construction','chart']},
  tax:{label:'Tax year',secs:['summary','loan','repayments','expenses'],period:'fy'}
};
let rOpt={co:'current',period:'all',from:'',to:'',share:'all',secs:['summary','land','loan','byshare','expenses','construction','chart','upcoming']};
const fyOf=d=>{const x=pd(d);return x?(x.getMonth()>=6?x.getFullYear()+1:x.getFullYear()):null};
const cyOf=d=>{const x=pd(d);return x?x.getFullYear():null};
const fyLabel=y=>`FY ${y-1}-${String(y).slice(2)}`;
function curFY(){return fyOf(iso(today()))}
function rangeFor(p){
  const t=today();
  if(p==='all')return null;
  if(p==='thism')return [iso(new Date(t.getFullYear(),t.getMonth(),1)),iso(new Date(t.getFullYear(),t.getMonth()+1,0))];
  if(p==='lastm')return [iso(new Date(t.getFullYear(),t.getMonth()-1,1)),iso(new Date(t.getFullYear(),t.getMonth(),0))];
  if(p==='fy')return rangeFor('fy:'+curFY());
  if(p==='lastfy')return rangeFor('fy:'+(curFY()-1));
  if(p.startsWith('fy:')){const y=Number(p.slice(3));return [`${y-1}-07-01`,`${y}-06-30`]}
  if(p.startsWith('cy:')){const y=Number(p.slice(3));return [`${y}-01-01`,`${y}-12-31`]}
  if(p==='custom')return [rOpt.from||'0000-01-01',rOpt.to||'9999-12-31'];
  return null;
}
function periodLabel(p){
  const r=rangeFor(p);
  if(!r)return 'All time';
  if(p==='fy'||p==='lastfy'||p.startsWith('fy:'))return `${fyLabel(Number(r[1].slice(0,4)))} (${fd(r[0])} to ${fd(r[1])})`;
  if(p.startsWith('cy:'))return `Calendar year ${p.slice(3)}`;
  if(p==='thism'||p==='lastm')return pd(r[0]).toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  return `${rOpt.from?fd(rOpt.from):'Start'} to ${rOpt.to?fd(rOpt.to):'today'}`;
}
const inR=(d,r)=>!r||((d||'')>=r[0]&&(d||'')<=r[1]);
function rCompanies(){return rOpt.co==='both'?COMPANIES.map(x=>state[x.id]):[state[rOpt.co==='current'?cur:rOpt.co]]}
function reportModel(){
  const r=rangeFor(rOpt.period),S=rOpt.share==='all'?null:Number(rOpt.share),has=k=>rOpt.secs.includes(k);
  const cos=rCompanies(),blocks=[];
  const shareLabel=S?`Share ${S}`:'All shares';
  const companyData=c=>{
    const L=loanState(c);
    const pays=L.rows.filter(x=>inR(x.date,r)).reverse();
    const contribs=c.contributions.filter(x=>inR(x.date,r)&&(!S||shareOf(c,x)===S)).sort(byDate);
    const exps=c.expenses.filter(x=>inR(x.date,r)).sort(byDate);
    return {c,L,pays,contribs,exps,repaid:sum(pays,x=>x.amount),interest:sum(pays,x=>x.interest),principal:sum(pays,x=>x.principal),expTotal:sum(exps,x=>x.amount),paidIn:sum(contribs,x=>x.amount)};

    if(has('loan'))blocks.push({type:'kv',title:pre+'Mortgage',items:[['Lender',c.loan.lender||'—'],['Loan type',c.loan.loanType||'Variable'],['Amount borrowed',m0(c.loan.principal)],['Interest rate now',d.L.rate?fpct(d.L.rate)+' p.a.':'—'],['Monthly repayment',m2(d.L.R)],[S?`${shareLabel} per month (25%)`:'Each share per month (25%)',m2(d.L.R/4)],['Balance now',m0(d.L.bal)],['Paid off by',d.L.months?monthYear(addMonths(today(),d.L.months)):'—'],['Next repayment',due?fd(due.date):'—']]});

      rows:d.pays.map(x=>[fd(x.date),x.bank||'—',payTypeLabel(x.type),m2(x.amount),m2(x.principal),m2(x.interest),m0(x.balance),...(S?[m2(x.amount/4)]:[])]),
      foot:d.pays.length?['Total','','',m2(d.repaid),m2(d.principal),m2(d.interest),'',...(S?[m2(d.repaid/4)]:[])]:null,empty:'No repayments in this period.'});

      blocks.push({type:'table',title:pre+'Paid in by share',cols:['Share','Members','Ownership','Paid in'],num:[2,3],rows,foot:S?null:['Total','','100%',m2(sum(c.contributions.filter(x=>inR(x.date,r)),x=>x.amount))]});}
    if(has('payments'))blocks.push({type:'table',title:pre+(S?`Payments by ${shareLabel}`:'Payments'),cols:['Date','Share','Type','Amount','Note'],num:[3],rows:d.contribs.map(x=>[fd(x.date),'Share '+shareOf(c,x),x.type||'',m2(x.amount),x.note||'']),foot:d.contribs.length?['Total','','',m2(d.paidIn),'']:null,empty:'No payments in this period.'});
    if(has('expenses')){const cats={};d.exps.forEach(e=>{const k=e.category||'Other';cats[k]=(cats[k]||0)+num(e.amount)});
      const UT=d.exps.filter(e=>e.kind==='utility'),WK=d.exps.filter(e=>e.kind!=='utility');
      if(UT.length)blocks.push({type:'table',title:pre+'Utilities',cols:['Date paid','Utility','Invoice / bill no.','Amount paid'],num:[3],rows:UT.map(e=>[fd(e.date),e.utility||e.category||'',e.invoice||'—',m2(e.amount)]),foot:['Total','','',m2(sum(UT,e=>e.amount))]});
      blocks.push({type:'table',title:pre+'Outgoings by category',cols:['Category','Amount',S?`${shareLabel} (25%)`:'Per share (25%)'],num:[1,2],rows:Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,m2(v),m2(v/4)]),foot:d.exps.length?['Total',m2(d.expTotal),m2(d.expTotal/4)]:null,empty:'No expenses in this period.'});
      if(WK.length)blocks.push({type:'table',title:pre+'Project works',cols:['Date','Item','Category','Invoice no.','Amount'],num:[4],rows:WK.map(e=>[fd(e.date),e.description||'',e.category||'',e.invoice||'—',m2(e.amount)]),foot:['Total','','','',m2(sum(WK,e=>e.amount))]});}
    if(has('construction')){const sp=(id,rr)=>sum(c.expenses.filter(e=>e.stageId===id&&inR(e.date,rr)),e=>e.amount);
      blocks.push({type:'table',title:pre+'Construction',cols:['Stage','Status','Budget','Spent in period','Spent to date','Remaining'],num:[2,3,4,5],rows:c.stages.map(s=>[s.name,s.status||'',m0(s.budget),m0(sp(s.id,r)),m0(sp(s.id,null)),m0(num(s.budget)-sp(s.id,null))]),
        foot:c.stages.length?['Total','',m0(sum(c.stages,s=>s.budget)),m0(sum(c.stages,s=>sp(s.id,r))),m0(sum(c.stages,s=>sp(s.id,null))),m0(sum(c.stages,s=>num(s.budget)-sp(s.id,null)))]:null,empty:'No construction stages yet.'});}
    if(has('chart')){const months={};[...d.pays,...d.exps].forEach(x=>{const k=(x.date||'').slice(0,7);if(k)months[k]=(months[k]||0)+num(x.amount)});

  const sub=[periodLabel(rOpt.period),shareLabel].join(' · ');

}
function monthBars(list){
  if(!list.length)return '<div class="empty">Nothing paid out in this period.</div>';
  const W=640,H=180,pl=44,pb=22,pt=10,max=Math.max(...list.map(x=>x[1])),bw=(W-pl-10)/list.length;
  const y=v=>pt+(1-v/max)*(H-pt-pb);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Money paid out each month">
    ${[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-6}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="currentColor" stroke-opacity=".12"/><text class="axis v" x="${pl-6}" y="${y(max*f)+4}" text-anchor="end">${mk(max*f)}</text>`).join('')}
    ${list.map((m,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;const lab=i%Math.ceil(list.length/8)===0;const [yy,mm]=m[0].split('-');return `<rect x="${x.toFixed(1)}" y="${y(m[1]).toFixed(1)}" width="${w.toFixed(1)}" height="${(H-pb-y(m[1])).toFixed(1)}" rx="3" style="fill:var(--gold)"><title>${m[0]}: ${m0(m[1])}</title></rect>${lab?`<text class="axis" x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${new Date(+yy,+mm-1,1).toLocaleDateString('en-AU',{month:'short'})} ${yy.slice(2)}</text>`:''}`}).join('')}
  </svg>`;
}
function blockHtml(b,forFile){

  if(b.type==='kv')return `<section class="rsec"><h3>${esc(b.title)}</h3><dl class="rkv">${b.items.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>`;

let pdfLibP=null;
function loadScript(src){return new Promise((ok,bad)=>{const t=document.createElement('script');t.src=src;t.onload=ok;t.onerror=()=>bad(new Error('Could not load '+src));document.head.appendChild(t)})}

  const txt=s=>String(s).replace(/m\u00b2/g,'sq m').replace(/[^\x20-\x7E -ÿ]/g,c=>c==='²'?'2':c==='—'?'-':c==='–'?'-':c==='·'?'·':'');

  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90,104,126);doc.text(txt(`${M.sub} · Prepared ${M.made}`),mx,y,{maxWidth:W-2*mx});y+=12;
  doc.setDrawColor(...ACC);doc.setLineWidth(1.5);doc.line(mx,y,W-mx,y);y+=16;
  const need=h=>{if(y+h>H-50){doc.addPage();y=48}};
  const head=t=>{need(40);doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...NAVY);doc.text(txt(t),mx,y);y+=6};
  for(const b of M.blocks){
    if(b.type==='company'){need(50);y+=6;doc.setDrawColor(200,205,215);doc.setLineWidth(.6);doc.line(mx,y,W-mx,y);y+=20;doc.setFont('times','normal');doc.setFontSize(17);doc.setTextColor(...NAVY);doc.text(txt(b.title),mx,y);y+=24;continue}
    head(b.title);
    if(b.type==='kv'){doc.autoTable({startY:y,margin:{left:mx,right:mx},theme:'plain',styles:{fontSize:9.5,cellPadding:3,textColor:[21,33,58]},columnStyles:{0:{textColor:[90,104,126],cellWidth:190},1:{fontStyle:'bold'}},body:b.items.map(([k,v])=>[txt(k),txt(v)])});y=doc.lastAutoTable.finalY+14;continue}
    if(b.type==='table'){
      if(!b.rows.length){doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(90,104,126);y+=12;doc.text(txt(b.empty||'Nothing to show.'),mx,y);y+=16;continue}
      const cst={};(b.num||[]).forEach(i=>cst[i]={halign:'right'});
      doc.autoTable({startY:y,margin:{left:mx,right:mx},theme:'striped',styles:{fontSize:8.5,cellPadding:4,textColor:[21,33,58]},headStyles:{fillColor:NAVY,textColor:255,fontStyle:'bold'},footStyles:{fillColor:[235,239,246],textColor:[21,33,58],fontStyle:'bold'},
        columnStyles:cst,head:[b.cols.map(txt)],body:b.rows.map(r=>r.map(txt)),foot:b.foot?[b.foot.map(txt)]:undefined,
        didParseCell:d=>{if((b.num||[]).includes(d.column.index))d.cell.styles.halign='right'}});
      y=doc.lastAutoTable.finalY+16;continue}
    if(b.type==='chart'){
      if(!b.list.length){y+=12;doc.setFontSize(9.5);doc.setTextColor(90,104,126);doc.text('Nothing paid out in this period.',mx,y);y+=16;continue}
      const ch=150;need(ch+30);y+=10;const max=Math.max(...b.list.map(x=>x[1])),cw=W-2*mx-40,bw=cw/b.list.length,x0=mx+40,base=y+ch;
      doc.setFontSize(7.5);doc.setTextColor(90,104,126);doc.setDrawColor(225,229,236);doc.setLineWidth(.5);
      [0,.5,1].forEach(f=>{const yy=base-f*ch;doc.line(x0,yy,W-mx,yy);doc.text(txt(mk(max*f)),x0-4,yy+3,{align:'right'})});
      doc.setFillColor(...ACC);
      b.list.forEach((m,i)=>{const h=m[1]/max*ch,x=x0+i*bw+bw*.18;doc.rect(x,base-h,bw*.64,h,'F');if(i%Math.ceil(b.list.length/8)===0){const [yy,mm]=m[0].split('-');doc.text(new Date(+yy,+mm-1,1).toLocaleDateString('en-AU',{month:'short'})+' '+yy.slice(2),x+bw*.32,base+11,{align:'center'})}});

  return doc.output('arraybuffer');
}

  if(!rs.length)return '<div class="empty">No one in this group.</div>';
  const miss=rs.filter(r=>r.missing.length);
  return `<p class="small" style="margin-bottom:6px"><b>Preview for ${esc(rs[0].name)}</b> · goes to ${rs.length} ${rs.length===1?'person':'people'}${channels.length?` by ${channels.map(chLabel).join(', ')}`:''}</p><div class="preview">${esc(rs[0].text)}</div>${miss.length?`<p class="small" style="margin-top:8px;color:var(--warn)">Missing contact details: ${miss.map(r=>`${esc(r.name)} (${r.missing.map(chLabel).join(', ')})`).join('; ')}</p>`:''}`;
}

function sendReminder(id){
  const c=C(),r=c.reminders.find(a=>a.id===id);if(!r)return;
  const recips=recipientsFor(c,r.audience,r.channels||[],p=>fill(r.message,c,p,remVars(c,r,p)));
  openForm({title:`Send: ${r.title}`,saveLabel:'Send now',noFocus:1,

    fields:[{id:'pv',type:'html',html:previewHtml(c,r.audience,r.channels||[],p=>fill(r.message,c,p,remVars(c,r,p)))}],

async function deliver(c,msg){
  const ch=msg.channels||[];
  if(ch.includes('email')){
    const list=msg.recipients.filter(r=>r.email).map(r=>({to:r.email,subject:`${msg.subject} · ${c.name}`,body:r.text}));
    if(list.length){toast(`Sending ${list.length} emails…`);
      try{const res=await api('sendEmail',{id:c.id,emails:list});msg.emailed=res.sent||0;msg.emailFrom=res.from;commit();
        toast(res.ok?`Emailed ${res.sent} people from ${res.from}${res.aliasReady?'':' (company address not set up as Send mail as yet)'}`:'Email failed: '+res.error)}
      catch(e){toast('Email failed. Check your internet connection.')}}
  }
  const other=ch.filter(x=>x!=='email');
  if(other.length)setTimeout(()=>openForm({title:'Send by '+other.map(chLabel).join(' and '),noSave:1,noFocus:1,fields:[{id:'l',type:'html',html:`<div class="slist">${msg.recipients.map(r=>{const w=waNum(r.whatsapp||r.mobile),b=[];
    if(other.includes('whatsapp')&&w)b.push(`<a class="btn sm" href="https://wa.me/${w}?text=${encodeURIComponent(r.text)}" target="_blank" rel="noopener">WhatsApp</a>`);
    if(other.includes('sms')&&r.mobile)b.push(`<a class="btn sm" href="sms:${encodeURIComponent(String(r.mobile).replace(/\s/g,''))}?&body=${encodeURIComponent(r.text)}">SMS</a>`);
    return `<div class="srow"><div><b>${esc(r.name)}</b><small>${esc(r.mobile||'No mobile')}</small></div><div class="actions">${b.join('')||'<span class="muted small">No number</span>'}</div></div>`}).join('')}</div>`}]}),400);
}

const CFG=window.PBK_CONFIG||{};
let authToken=null,authEmail='',versions={};
function tokenExp(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}}
function tokenEmail(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).email||''}catch(e){return ''}}
async function api(action,payload){
  if(!authToken||tokenExp(authToken)<Date.now()+30000){await signIn(true)}
  const r=await fetch(CFG.scriptUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:authToken,...payload})});
  const j=await r.json();
  if(!j.ok&&j.auth){authToken=null;try{localStorage.removeItem('pbk-token')}catch(e){}await signIn(false);return api(action,payload)}
  return j;
}
let signInWait=null;
function showGate(msg){const g=$('#gate');g.hidden=false;$('#gatemsg').textContent=msg||'';}
function signIn(silent){
  if(signInWait)return signInWait;
  signInWait=new Promise(resolve=>{
    const start=()=>{
      if(!window.google||!google.accounts||!google.accounts.id){setTimeout(start,200);return}
      google.accounts.id.initialize({client_id:CFG.clientId,auto_select:true,cancel_on_tap_outside:false,
        callback:resp=>{authToken=resp.credential;authEmail=tokenEmail(authToken);try{localStorage.setItem('pbk-token',authToken)}catch(e){}
          $('#gate').hidden=true;signInWait=null;resolve()}});
      showGate(silent?'':'Please sign in again to continue.');
      google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:260});
      google.accounts.id.prompt();
    };start();
  });
  return signInWait;
}
function signOut(){try{localStorage.removeItem('pbk-token')}catch(e){}authToken=null;try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()}
async function doSave(id){
  if(writing[id]){pending[id]=true;return}
  writing[id]=true;
  try{
    const res=await api('save',{id,data:JSON.parse(JSON.stringify(state[id])),version:versions[id]||0});
    if(res.ok){versions[id]=res.version;setStatus('ok','All changes saved')}
    else if(res.conflict){versions[id]=res.version;state[id]=normalize(res.data,COMPANIES.find(x=>x.id===id));render();setStatus('ok','Updated from the server');toast('This company was changed elsewhere (or a reminder was sent). The latest figures are now showing. Please redo your last change.')}
    else{setStatus('off','Not saved');toast('Could not save: '+(res.error||'try again'))}
  }catch(e){setStatus('off','Not saved');toast('Could not save. Check your internet connection.')}
  finally{writing[id]=false;if(pending[id]){pending[id]=false;doSave(id)}}
}
async function reloadAll(){
  const res=await api('load',{});
  if(!res.ok)throw new Error(res.error||'Could not load');
  COMPANIES.forEach(co=>{const x=res.companies[co.id];if(x&&x.data){state[co.id]=normalize(x.data,co);versions[co.id]=x.version}else{versions[co.id]=0}});
}
(async function init(){
  readHash();render();
  if(!CFG.scriptUrl||!CFG.clientId){showGate('');$('#gatemsg').textContent='Setup is not finished: add the Apps Script link and Google client ID to config.js.';return}
  try{const t=localStorage.getItem('pbk-token');if(t&&tokenExp(t)>Date.now()+60000){authToken=t;authEmail=tokenEmail(t)}}catch(e){}
  if(!authToken)await signIn(true);
  db=true;setStatus('busy','Loading…');
  try{await reloadAll();setStatus('ok','All changes saved')}
  catch(e){setStatus('off','Could not load saved data');toast('Could not load your data: '+e.message)}
  finally{loaded=true;render()}
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&!Object.values(writing).some(Boolean)&&$('#modal').hidden){try{await reloadAll();render()}catch(e){}}});
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
</script>
